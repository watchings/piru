<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Piru, a private dose journal and pharmacology reference">
    <meta name="theme-color" content="#eb4470">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="theme.css">
    <title>Piru</title>
  </head>
  <body>
    <main>
      <h1>Piru</h1>
      <p>A private, local-first dose journal and pharmacology reference.</p>
      <p><strong>Your data stays in this browser.</strong> Browsers can clear local
        storage. Export an encrypted backup regularly; Piru has no sync service.</p>
      <button id="export" type="button">Export encrypted backup</button>
      <button id="notify" type="button">Enable reminders</button>
      <button id="print" type="button">Print / save journal as PDF</button>
      <label>
        Import encrypted backup
        <input id="import" type="file" accept="application/json">
      </label>
      <form id="dose-form">
        <h2>Log a dose</h2>
        <input name="substance" placeholder="Substance" required>
        <input name="amount" type="number" min="0" step="any" placeholder="Amount" required>
        <input name="unit" value="mg" required>
        <select name="route">
          <option value="oral">Oral</option>
          <option value="sublingual">Sublingual</option>
          <option value="inhalation">Inhalation</option>
          <option value="insufflation">Insufflation</option>
        </select>
        <input name="notes" placeholder="Note (optional)">
        <button type="submit">Save dose</button>
      </form>
      <h2>Recent doses</h2>
      <ul id="doses"></ul>
      <h2>Local insights</h2>
      <p id="insights">No local insights yet.</p>
      <label>
        Search the substance library
        <input id="search" type="search" autocomplete="off">
      </label>
      <label>
        Barcode value
        <input id="barcode" inputmode="numeric" autocomplete="off">
      </label>
      <button id="scan-barcode" type="button">Scan barcode</button>
      <video id="barcode-preview" autoplay playsinline hidden></video>
      <ul id="results"></ul>
      <output id="status" role="status"></output>
    </main>
    <script type="module" src="app.js"></script>
    <script type="module" src="journal.js"></script>
  </body>
</html>
